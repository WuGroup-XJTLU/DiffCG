temperature: 600.0
zero_eps: 1.0e-7
edge_quantile: 0.0001

potentials:
  pair:
    distribution: ../example/polystyrene/data/T600/nb_smoothed.dist.tgt
    discretization: {end: 2.0, nbins: 200, start: 0.0}
    spline_grid: [0.4, 2.0, 80]
    prior: {type: generic_repulsion, sigma: 0.6, epsilon: 1.0, exp: 8}
    r_min: 0.4
  bond:
    distribution: ../example/polystyrene/data/T600/bondAA_smooth.dist.tgt
    discretization: {end: 1.0, nbins: 200, start: 0.0}
    spline_grid: [0.1, 1.0, 45]
    prior: {type: harmonic_spring, length: 0.45, epsilon: 5000.0}
  angle:
    distribution: ../example/polystyrene/data/T600/angleAAA.dist.tgt
    discretization: {end: 3.14159, nbins: 200, start: 0.0}
    spline_grid: [0.1, 3.14, 55]
    prior: {type: harmonic_angle, angle_0: 1.5, epsilon: 50.0}
  dihedral:
    distribution: ../example/polystyrene/data/T600/dihedralAAAA.dist.tgt
    discretization: {end: 3.14159, nbins: 200, start: -3.14159}
    spline_grid: [-3.14, 3.14, 100]
    prior: {type: harmonic_dihedral, angle_0: 1.5, epsilon: 50.0}

optimization:
  num_steps: 50000
  initial_lr: 0.1
  lr_decay_steps: 100000
  lr_min_scale: 0.001
  adam_b1: 0.9
  adam_b2: 0.99
  init_scale: 0.001
  seed: 3

output:
  params_file: pretrained_params.npy
  plot_dir: pretrain_plots
